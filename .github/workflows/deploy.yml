name: MCJP Blog Auto Publish & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  auto-publish-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Build Check
        run: npm run build
